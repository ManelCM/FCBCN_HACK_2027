[project]
name = "hackbarca"
version = "0.1.0"
description = "More Than A Hack 2027 - deteccion de posesion H/A/D"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kloppy==3.18.0",
    "numpy>=1.26,<2",
    "pandas>=2,<3",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbarca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
