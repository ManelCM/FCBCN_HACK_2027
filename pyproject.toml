[project]
name = "hackbarca"
version = "0.1.0"
description = "More Than A Hack 2027 - deteccion de posesion H/A/D"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kloppy==3.18.0",
    "numpy>=1.26,<2",
    "pandas>=2,<3",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "xgboost>=2.1",
]

[dependency-groups]
audio = [
    "faster-whisper==1.1.1",
    "imageio-ffmpeg==0.5.1",
]
dev = [
    "pytest>=8.0",
]
vision = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "torch>=2.5",
    "torchvision>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbarca"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vision (Frente A): solo para quien ejecuta el detector en local con GPU. La entrega no lo usa.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", group = "vision" }
torchvision = { index = "pytorch-cu124", group = "vision" }
